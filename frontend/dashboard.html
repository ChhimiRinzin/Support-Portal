<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RAA Support Portal – Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== all styles identical to your original ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body { background: #F4F6F9; }
        .app { display: flex; min-height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #E2E8F0;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #E2E8F0;
            text-align: center;
        }
        .sidebar-logo { max-width: 100%; height: auto; max-height: 70px; }
        .nav-menu {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav-bottom {
            margin-top: auto;
            padding: 16px 12px;
            border-top: 1px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            color: #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item:hover { background: #E9F4F4; color: #0F5C5F; }
        .nav-item.active { background: #0F5C5F; color: white; }
        .nav-item.has-submenu { justify-content: space-between; }
        .submenu {
            margin-left: 34px;
            list-style: none;
            overflow: hidden;
            transition: max-height 0.3s ease;
            max-height: 0;
        }
        .submenu.show { max-height: 200px; }
        .submenu li {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #475569;
            font-size: 0.85rem;
        }
        .submenu li:hover { background: #E9F4F4; color: #0F5C5F; }

        /* ===== MAIN ===== */
        .main { flex: 1; margin-left: 260px; }
        .topbar {
            background: white;
            padding: 12px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid #E2E8F0;
        }
        .menu-toggle { display: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #0F5C5F; margin-right: auto; }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .notification-bell { position: relative; cursor: pointer; }
        .notification-bell .badge {
            position: absolute;
            top: -8px; right: -12px;
            background: #EF4444;
            color: white;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 10px;
            display: none;
        }
        .user-avatar {
            width: 34px; height: 34px;
            background: #0F5C5F;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .content { padding: 24px 28px; }

        /* ===== HEADER STRIP ===== */
        .assigned-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding: 18px 24px;
            background: white;
            border-radius: 16px;
            border-left: 5px solid #0F5C5F;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .assigned-header-left { display: flex; align-items: center; gap: 14px; }
        .assigned-header-icon {
            width: 44px; height: 44px;
            background: #E9F4F4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #0F5C5F;
            flex-shrink: 0;
        }
        .assigned-header-text h2 { font-size: 1.15rem; font-weight: 700; color: #0F5C5F; margin-bottom: 2px; }
        .assigned-header-text p { font-size: 0.82rem; color: #64748B; }
        .assigned-header-date { font-size: 0.82rem; color: #64748B; display: flex; align-items: center; gap: 6px; }

        /* ===== STATS GRID ===== */
        .assigned-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }
        .assigned-stat-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .assigned-stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
        .assigned-stat-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .assigned-stat-body { min-width: 0; }
        .assigned-stat-number { font-size: 22px; font-weight: 700; line-height: 1.1; }
        .assigned-stat-label { font-size: 11px; color: #64748B; margin-top: 2px; white-space: nowrap; }

        /* ===== FILTER PANEL ===== */
        .assigned-filter-panel {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .assigned-filter-panel .search-wrapper { flex: 1; min-width: 180px; }
        .assigned-filter-panel .filter-select,
        .assigned-filter-panel .filter-input {
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            font-size: 13px;
            padding: 7px 12px;
            color: #334155;
        }
        .assigned-filter-panel .search-wrapper input {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            font-size: 13px;
            padding: 7px 12px 7px 34px;
        }
        .search-wrapper { position: relative; }
        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
        }

        /* ===== TICKET TABLE ===== */
        .assigned-table-wrap {
            background: white;
            border-radius: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .assigned-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        .assigned-table thead th {
            background: #F8FAFC;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748B;
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #E2E8F0;
        }
        .assigned-table tbody tr {
            border-bottom: 1px solid #F1F5F9;
            transition: background 0.15s;
        }
        .assigned-table tbody tr:last-child { border-bottom: none; }
        .assigned-table tbody tr:hover { background: #F8FAFC; }
        .assigned-table td { padding: 12px 14px; vertical-align: middle; font-size: 13px; }

        /* Status strips */
        .at-status-strip { width: 4px; padding: 0 !important; }
        .at-strip-pending_approval { background: #F59E0B; }
        .at-strip-approved          { background: #10B981; }
        .at-strip-in_progress       { background: #3B82F6; }
        .at-strip-resolved          { background: #22C55E; }
        .at-strip-rejected          { background: #EF4444; }

        /* Category icon */
        .at-cat-icon {
            width: 32px; height: 32px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        /* Ticket meta */
        .at-ticket-meta { display: flex; flex-direction: column; gap: 2px; }
        .at-ticket-num  { font-size: 11px; color: #94A3B8; font-weight: 500; }
        .at-ticket-title { font-size: 13px; font-weight: 600; color: #1E293B; }
        .at-date { font-size: 12px; color: #64748B; white-space: nowrap; }

        /* View button */
        .at-view-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border-radius: 8px;
            background: #0F5C5F;
            color: white;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s, transform 0.15s;
            white-space: nowrap;
        }
        .at-view-btn:hover { background: #0a4547; transform: translateY(-1px); }

        /* Action buttons */
        .action-buttons { display: inline-flex; gap: 8px; align-items: center; }
        .action-btn {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 30px;
            background: white;
            border: 1px solid #CBD5E1;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .edit-btn { color: #E68A2E; border-color: #FFE0C2; }
        .edit-btn:hover { background: #E68A2E; color: white; }
        .delete-btn { color: #D14545; border-color: #FFD6D6; }
        .delete-btn:hover { background: #D14545; color: white; }

        /* Pagination */
        .assigned-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid #F1F5F9;
        }
        .assigned-pagination button {
            padding: 5px 14px;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            background: white;
            font-size: 12px;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s;
        }
        .assigned-pagination button:hover:not(:disabled) { background: #0F5C5F; color: white; border-color: #0F5C5F; }
        .assigned-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .ap-page-info { font-size: 12px; color: #64748B; padding: 0 6px; }

        /* Status badges */
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 30px; font-size: 0.75rem; font-weight: 500; }
        .status-pending_approval { background: #FEF3C7; color: #B45309; }
        .status-approved         { background: #DCFCE7; color: #166534; }
        .status-in_progress      { background: #E0F2FE; color: #0369A1; }
        .status-resolved         { background: #DCFCE7; color: #166534; }
        .status-rejected         { background: #FEE2E2; color: #B91C1C; }

        /* Empty state */
        .empty-state { text-align: center; padding: 48px 24px; background: white; border-radius: 16px; color: #64748B; }

        /* ===== MODALS ===== */
        .modal, .edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active, .edit-modal.active { display: flex; }
        .modal-content, .edit-modal-content {
            background: white;
            border-radius: 28px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.25);
        }
        .modal-close {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 28px;
            cursor: pointer;
            color: #94A3B8;
            transition: 0.2s;
        }
        .modal-close:hover { color: #b91c1c; }

        /* ===== SIMPLE TICKET VIEW ===== */
        .tv-section { margin-bottom: 24px; }
        .tv-section:last-child { margin-bottom: 0; }
        .tv-heading {
            font-size: 1rem;
            font-weight: 700;
            color: #0F5C5F;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #E2E8F0;
        }
        .tv-row {
            display: flex;
            flex-wrap: wrap;
            padding: 6px 0;
            border-bottom: 1px solid #F1F5F9;
            font-size: 0.9rem;
        }
        .tv-row:last-child { border-bottom: none; }
        .tv-label { width: 180px; flex-shrink: 0; color: #64748B; font-weight: 500; }
        .tv-value { flex: 1; min-width: 150px; color: #1E293B; word-break: break-word; white-space: pre-wrap; }
        .tv-value.empty { color: #94A3B8; font-style: italic; }
        .tv-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
        .tv-table th, .tv-table td { border: 1px solid #E2E8F0; padding: 8px 10px; text-align: left; vertical-align: top; }
        .tv-table th { background: #F8FAFC; font-weight: 600; color: #334155; }
        .tv-status { display: inline-block; padding: 3px 10px; border-radius: 30px; font-size: 0.78rem; font-weight: 600; }

        /* Comment */
        .comment {
            border-left: 3px solid #0F5C5F;
            margin: 12px 0;
            padding: 12px 16px;
            background: #F8FAFC;
            border-radius: 12px;
        }
        .comment-meta { font-size: 0.75rem; color: #64748B; margin-bottom: 6px; }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #CBD5E1;
            font-size: 0.9rem;
            margin: 8px 0;
        }
        .btn-primary-sm {
            background: #0F5C5F;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Edit modal inputs */
        #editTicketModal input[type="text"],
        #editTicketModal textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .menu-toggle { display: block; }
            .topbar { justify-content: space-between; }
        }
        @media (max-width: 640px) {
            .content { padding: 16px; }
            .assigned-stats-grid { grid-template-columns: 1fr 1fr; }
            .action-buttons { gap: 4px; }
            .action-btn { padding: 4px 8px; font-size: 11px; }
            .tv-label { width: 130px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="images/dashboard_logo.png" alt="RAA Logo" class="sidebar-logo">
        </div>
        <div class="nav-menu">
            <div class="nav-item active" data-link="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
            <div class="nav-item" data-link="it-services"><i class="fas fa-laptop-code"></i> IT Services</div>
            <div class="nav-item" data-link="aims"><i class="fas fa-exchange-alt"></i> AIMS Change Request</div>
            <div class="nav-item" data-link="repair"><i class="fas fa-tools"></i> Repair &amp; Maintenance</div>
            <div class="nav-item" data-link="vehicle"><i class="fas fa-car"></i> Vehicle Requisition</div>
            <div class="nav-item has-submenu" id="aswsMenu">
                <span><i class="fas fa-building"></i> ASWS</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <ul class="submenu" id="aswsSubmenu">
                <li data-link="asws-registration">ASWS Registration</li>
                <li data-link="asws-loan">ASWS Loan Application</li>
            </ul>
        </div>
        <div class="nav-bottom">
            <div class="nav-item" id="settingsBtnSidebar"><i class="fas fa-cog"></i> Settings</div>
            <div class="nav-item" id="logoutBtnSidebar"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <div class="topbar-right">
                <div class="notification-bell" id="notificationBell"><i class="fas fa-bell"></i><span class="badge">0</span></div>
                <span id="userName"></span>
                <div class="user-avatar" id="userAvatar"></div>
            </div>
        </div>

        <div class="content">

            <!-- Header strip -->
            <div class="assigned-header">
                <div class="assigned-header-left">
                    <div class="assigned-header-icon"><i class="fas fa-tachometer-alt"></i></div>
                    <div class="assigned-header-text">
                        <h2 id="welcomeMsg">Dashboard</h2>
                        <p>Overview of all service requests you have submitted</p>
                    </div>
                </div>
                <div class="assigned-header-date">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="currentDate"></span>
                </div>
            </div>

            <!-- Stats -->
            <div class="assigned-stats-grid" id="statsGrid"></div>

            <!-- Filter panel -->
            <div class="assigned-filter-panel">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by ticket ID or subject…">
                </div>
                <select id="statusFilter" class="filter-select">
                    <option value="">All statuses</option>
                    <option value="pending_approval">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="rejected">Rejected</option>
                </select>
                <select id="categoryFilter" class="filter-select">
                    <option value="">All services</option>
                    <option value="repair">Repair &amp; Maintenance</option>
                    <option value="ict">IT Services</option>
                    <option value="vehicle">Vehicle Requisition</option>
                    <option value="aims">AIMS Change Request</option>
                    <option value="asws_membership">ASWS Registration</option>
                    <option value="asws_loan">ASWS Loan</option>
                </select>
                <input type="date" id="dateFilter" class="filter-input">
            </div>

            <!-- Tickets -->
            <div id="ticketsContainer"></div>
        </div>
    </div>
</div>

<!-- Modal: view ticket details -->
<div id="ticketModal" class="modal">
    <div class="modal-content" style="max-width: 1000px;">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="modalContent"></div>
    </div>
</div>

<!-- Modal: edit ticket -->
<div id="editTicketModal" class="edit-modal">
    <div class="edit-modal-content">
        <span class="modal-close" onclick="closeEditModal()">&times;</span>
        <h2 style="margin-bottom:20px;"><i class="fas fa-edit"></i> Edit Ticket</h2>
        <form id="editTicketForm">
            <div style="margin-bottom: 20px;">
                <label style="font-size:0.85rem; font-weight:600; color:#475569;">Title</label>
                <input type="text" id="editTitle" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size:0.85rem; font-weight:600; color:#475569;">Description</label>
                <textarea id="editDescription" rows="4"></textarea>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button type="button" class="btn-primary-sm" onclick="closeEditModal()" style="background:#9AA6B5;">Cancel</button>
                <button type="submit" class="btn-primary-sm" style="background:#E68A2E;">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:5000/api';
    let allTickets = [], filteredTickets = [], currentPage = 1;
    const rowsPerPage = 5;
    let currentEditTicketId = null;
    const user = getUser();

    function getToken() { return localStorage.getItem('token'); }
    function getUser() { return JSON.parse(localStorage.getItem('user') || '{}'); }

    async function apiCall(endpoint, options = {}) {
        const token = getToken();
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (token) headers['x-auth-token'] = token;
        const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        if (res.status === 401) { localStorage.clear(); window.location.href = 'index.html'; throw new Error('Session expired'); }
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Request failed');
        return data;
    }

    if (!user || !user.id) window.location.href = 'index.html';

    // Header
    document.getElementById('userName').innerText = user.full_name || (user.email ? user.email.split('@')[0] : 'User');
    document.getElementById('userAvatar').innerText = (user.full_name || 'U').charAt(0).toUpperCase();

    // Greeting + date
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const displayName = user.full_name?.split(' ')[0] || user.email?.split('@')[0] || 'User';
    document.getElementById('welcomeMsg').innerText = `${greeting}, ${displayName}`;
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    document.getElementById('logoutBtnSidebar').onclick = () => { localStorage.clear(); window.location.href = 'index.html'; };
    document.getElementById('settingsBtnSidebar').onclick = () => { window.location.href = 'settings.html'; };

    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));

    const aswsMenu = document.getElementById('aswsMenu');
    const aswsSubmenu = document.getElementById('aswsSubmenu');
    aswsMenu.addEventListener('click', (e) => { e.stopPropagation(); aswsSubmenu.classList.toggle('show'); });

    document.querySelectorAll('.nav-item[data-link], .submenu li').forEach(el => {
        el.addEventListener('click', () => {
            const link = el.dataset.link;
            if (link === 'dashboard') window.location.reload();
            else if (link === 'it-services') window.location.href = 'ict-form.html';
            else if (link === 'aims') window.location.href = 'aims-change-form.html';
            else if (link === 'repair') window.location.href = 'repair-form.html';
            else if (link === 'vehicle') window.location.href = 'vehicle-requisition-form.html';
            else if (link === 'asws-registration') window.location.href = 'submit-request.html?category=asws_membership';
            else if (link === 'asws-loan') window.location.href = 'submit-request.html?category=asws_loan';
        });
    });

    async function deleteTicket(ticketId, ticketNumber) {
        if (!confirm(`Are you sure you want to delete ticket ${ticketNumber}? This cannot be undone.`)) return;
        try {
            await apiCall(`/requests/${ticketId}`, { method: 'DELETE' });
            alert('Ticket deleted successfully.');
            await loadTickets();
        } catch (err) { alert('Delete failed: ' + err.message); }
    }

    function openEditModal(ticketId) {
        const ticket = allTickets.find(t => t.id === ticketId);
        if (!ticket) return;
        if (ticket.status !== 'pending_approval') { alert('You can only edit pending tickets.'); return; }
        currentEditTicketId = ticketId;
        document.getElementById('editTitle').value = ticket.title || '';
        document.getElementById('editDescription').value = ticket.description || '';
        document.getElementById('editTicketModal').classList.add('active');
    }
    function closeEditModal() { document.getElementById('editTicketModal').classList.remove('active'); currentEditTicketId = null; }
    document.getElementById('editTicketForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentEditTicketId) return;
        try {
            await apiCall(`/requests/${currentEditTicketId}`, {
                method: 'PUT',
                body: JSON.stringify({ title: document.getElementById('editTitle').value, description: document.getElementById('editDescription').value })
            });
            alert('Ticket updated.');
            closeEditModal();
            await loadTickets();
        } catch (err) { alert('Update failed: ' + err.message); }
    });

    // ----- Main load function with SORT fix -----
    async function loadTickets() {
        try {
            const requests = await apiCall('/requests');
            console.log('🔍 API /requests returned:', requests);
            if (!Array.isArray(requests)) {
                throw new Error('Unexpected response format (not an array)');
            }
            allTickets = requests.filter(r => r.created_by === user.id);
            // ✅ Sort: newest first
            allTickets.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            console.log('📌 Filtered tickets (created_by === user.id (${user.id})):', allTickets);
            applyFilters();
        } catch (err) {
            console.error('❌ Error loading tickets:', err);
            document.getElementById('ticketsContainer').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="font-size:2rem;color:#EF4444;display:block;margin-bottom:10px;"></i>
                    <p>Failed to load tickets: ${escapeHtml(err.message)}</p>
                    <small style="color:#94A3B8;">Check the console (F12) for more details.</small>
                </div>
            `;
        }
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        const category = document.getElementById('categoryFilter').value;
        const date = document.getElementById('dateFilter').value;
        filteredTickets = allTickets.filter(t =>
            (t.ticket_number.toLowerCase().includes(search) || t.title.toLowerCase().includes(search))
            && (!status || t.status === status)
            && (!category || t.category === category)
            && (!date || new Date(t.created_at).toISOString().slice(0,10) === date)
        );
        currentPage = 1;
        renderStats();
        renderTickets();
    }

    function renderStats() {
        const total      = filteredTickets.length;
        const pending    = filteredTickets.filter(t => t.status === 'pending_approval').length;
        const inProgress = filteredTickets.filter(t => t.status === 'in_progress').length;
        const approved   = filteredTickets.filter(t => t.status === 'approved').length;
        const resolved   = filteredTickets.filter(t => t.status === 'resolved').length;
        const rejected   = filteredTickets.filter(t => t.status === 'rejected').length;
        document.getElementById('statsGrid').innerHTML = `
            <div class="assigned-stat-card" style="border-left-color:#64748B">
                <div class="assigned-stat-icon" style="background:#F1F5F9; color:#64748B"><i class="fas fa-layer-group"></i></div>
                <div class="assigned-stat-body"><div class="assigned-stat-number">${total}</div><div class="assigned-stat-label">Total Tickets</div></div>
            </div>
            <div class="assigned-stat-card" style="border-left-color:#F59E0B">
                <div class="assigned-stat-icon" style="background:#FEF9EC; color:#B45309"><i class="fas fa-clock"></i></div>
                <div class="assigned-stat-body"><div class="assigned-stat-number">${pending}</div><div class="assigned-stat-label">Pending</div></div>
            </div>
            <div class="assigned-stat-card" style="border-left-color:#3B82F6">
                <div class="assigned-stat-icon" style="background:#EFF6FF; color:#1D4ED8"><i class="fas fa-spinner"></i></div>
                <div class="assigned-stat-body"><div class="assigned-stat-number">${inProgress}</div><div class="assigned-stat-label">In Progress</div></div>
            </div>
            <div class="assigned-stat-card" style="border-left-color:#10B981">
                <div class="assigned-stat-icon" style="background:#ECFDF5; color:#065F46"><i class="fas fa-check-circle"></i></div>
                <div class="assigned-stat-body"><div class="assigned-stat-number">${approved}</div><div class="assigned-stat-label">Approved</div></div>
            </div>
            <div class="assigned-stat-card" style="border-left-color:#22C55E">
                <div class="assigned-stat-icon" style="background:#F0FDF4; color:#15803D"><i class="fas fa-check-double"></i></div>
                <div class="assigned-stat-body"><div class="assigned-stat-number">${resolved}</div><div class="assigned-stat-label">Resolved</div></div>
            </div>
            <div class="assigned-stat-card" style="border-left-color:#EF4444">
                <div class="assigned-stat-icon" style="background:#FEF2F2; color:#B91C1C"><i class="fas fa-times-circle"></i></div>
                <div class="assigned-stat-body"><div class="assigned-stat-number">${rejected}</div><div class="assigned-stat-label">Rejected</div></div>
            </div>
        `;
    }

    function renderTickets() {
        const container = document.getElementById('ticketsContainer');
        if (!filteredTickets.length) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox" style="font-size:2rem;margin-bottom:10px;display:block;color:#CBD5E1"></i><p>No tickets found</p><small>Create a new request using the sidebar.</small></div>`;
            return;
        }

        const catIcon  = c => ({ repair:'fa-tools', ict:'fa-laptop-code', vehicle:'fa-car', aims:'fa-exchange-alt', asws_membership:'fa-id-card', asws_loan:'fa-hand-holding-usd' }[c] || 'fa-tag');
        const catColor = c => ({ repair:'#F59E0B', ict:'#3B82F6', vehicle:'#8B5CF6', aims:'#06B6D4', asws_membership:'#10B981', asws_loan:'#EC4899' }[c] || '#64748B');
        const catBg    = c => ({ repair:'#FEF3C7', ict:'#EFF6FF', vehicle:'#EDE9FE', aims:'#E0F7FA', asws_membership:'#DCFCE7', asws_loan:'#FCE7F3' }[c] || '#F1F5F9');

        const start     = (currentPage - 1) * rowsPerPage;
        const paginated = filteredTickets.slice(start, start + rowsPerPage);

        let rows = '';
        for (const t of paginated) {
            const icon      = catIcon(t.category);
            const color     = catColor(t.category);
            const bg        = catBg(t.category);
            const date      = new Date(t.created_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
            const isPending = t.status === 'pending_approval';
            rows += `
                <tr>
                    <td class="at-status-strip at-strip-${t.status}"></td>
                    <td style="padding-left:10px">
                        <div class="at-cat-icon" style="background:${bg}; color:${color}">
                            <i class="fas ${icon}"></i>
                        </div>
                    </td>
                    <td>
                        <div class="at-ticket-meta">
                            <span class="at-ticket-num">${escapeHtml(t.ticket_number)}</span>
                            <span class="at-ticket-title">${escapeHtml(t.title)}</span>
                        </div>
                    </td>
                    <td class="at-date">${date}</td>
                    <td><span class="status-badge status-${t.status}">${t.status.replace(/_/g,' ')}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="at-view-btn" onclick="showTicketModal(${t.id})">
                                <i class="fas fa-eye"></i> View
                            </button>
                            ${isPending ? `<button class="action-btn edit-btn" onclick="openEditModal(${t.id})"><i class="fas fa-pen"></i> Edit</button>` : ''}
                            ${isPending ? `<button class="action-btn delete-btn" onclick="deleteTicket(${t.id},'${escapeHtml(t.ticket_number)}')"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </td>
                </tr>`;
        }

        const totalPages = Math.ceil(filteredTickets.length / rowsPerPage);
        container.innerHTML = `
            <div class="assigned-table-wrap">
                <div style="overflow-x:auto">
                    <table class="assigned-table">
                        <thead>
                            <tr>
                                <th style="width:4px; padding:0"></th>
                                <th style="width:40px"></th>
                                <th>Ticket / Title</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div class="assigned-pagination">
                    <button onclick="changePage(-1)" ${currentPage===1?'disabled':''}>&#8592; Prev</button>
                    <span class="ap-page-info">Page ${currentPage} of ${totalPages||1}</span>
                    <button onclick="changePage(1)" ${currentPage===totalPages||totalPages===0?'disabled':''}>Next &#8594;</button>
                </div>
            </div>`;
    }
    window.changePage = (delta) => { currentPage += delta; renderTickets(); };

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);
    document.getElementById('categoryFilter').addEventListener('change', applyFilters);
    document.getElementById('dateFilter').addEventListener('change', applyFilters);

    /* =====================================================
       MODAL RENDERING (same as before)
    ===================================================== */
    let currentModalTicket = null;

    async function showTicketModal(ticketId) {
        const modal = document.getElementById('ticketModal');
        const modalContent = document.getElementById('modalContent');
        modalContent.innerHTML = '<div style="text-align:center; padding:40px;">Loading...</div>';
        modal.classList.add('active');
        try {
            const data = await apiCall(`/requests/${ticketId}`);
            currentModalTicket = data.ticket;
            renderModalTicket();
            renderModalComments(data.comments);
            attachModalEventListeners();
        } catch (err) {
            modalContent.innerHTML = `<div style="color:red; padding:20px;">Error: ${err.message}</div>`;
        }
    }

    function closeModal() { document.getElementById('ticketModal').classList.remove('active'); currentModalTicket = null; }

    /* Rendering helpers */
    const TV_HANDLED_FORM_KEYS = new Set(['requisitioner', 'items', 'trips', 'start_date', 'end_date', 'vehicle_allocation', 'requisition_date']);

    function tvLabelize(key) {
        return String(key).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim().replace(/\b\w/g, c => c.toUpperCase());
    }

    function tvDisplay(value) {
        if (value === null || value === undefined || value === '') return null;
        if (Array.isArray(value)) {
            if (!value.length) return null;
            if (value.every(v => v === null || typeof v !== 'object')) return value.map(v => tvDisplay(v)).filter(v => v !== null).join(', ');
            return null;
        }
        if (typeof value === 'object') return null;
        return String(value);
    }

    function tvRow(label, value) {
        const display = tvDisplay(value);
        if (display === null) return `<div class="tv-row"><span class="tv-label">${escapeHtml(label)}</span><span class="tv-value empty">—</span></div>`;
        return `<div class="tv-row"><span class="tv-label">${escapeHtml(label)}</span><span class="tv-value">${escapeHtml(display)}</span></div>`;
    }

    function tvRowsForObject(obj, prefix) {
        let html = '';
        for (const key of Object.keys(obj)) {
            const label = prefix ? `${prefix} – ${tvLabelize(key)}` : tvLabelize(key);
            const val = obj[key];
            if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
                html += tvRowsForObject(val, label);
            } else if (Array.isArray(val) && val.length && val.every(v => v !== null && typeof v === 'object')) {
                val.forEach((item, idx) => { html += tvRowsForObject(item, `${label} ${idx + 1}`); });
            } else {
                html += tvRow(label, val);
            }
        }
        return html;
    }

    function renderModalTicket() {
        const container = document.getElementById('modalContent');
        const ticket = currentModalTicket;
        const fd = ticket.form_data || {};
        const allocation = fd.vehicle_allocation || null;
        const hasAllocation = allocation && (allocation.vehicle_no || allocation.driver_name);

        const statusClass = 'tv-status status-' + (ticket.status || '');
        const ticketInfoHtml = `
            <div class="tv-section">
                <div class="tv-heading"><i class="fas fa-ticket-alt"></i> Ticket Information</div>
                ${tvRow('Ticket Number', ticket.ticket_number)}
                ${tvRow('Title', ticket.title)}
                ${tvRow('Category', ticket.category ? ticket.category.replace(/_/g,' ') : ticket.category)}
                <div class="tv-row">
                    <span class="tv-label">Status</span>
                    <span class="tv-value"><span class="${statusClass}">${escapeHtml(ticket.status ? ticket.status.replace(/_/g,' ') : '')}</span></span>
                </div>
                ${tvRow('Requester', ticket.requester_name || ticket.requester_email)}
                ${ticket.requester_email && ticket.requester_name ? tvRow('Requester Email', ticket.requester_email) : ''}
                ${tvRow('Created', ticket.created_at ? new Date(ticket.created_at).toLocaleString() : null)}
                ${ticket.updated_at ? tvRow('Last Updated', new Date(ticket.updated_at).toLocaleString()) : ''}
                ${tvRow('Priority', ticket.priority)}
                ${tvRow('Description', ticket.description)}
            </div>
        `;

        let requisitionerHtml = '';
        if (fd.requisitioner && typeof fd.requisitioner === 'object') {
            const r = fd.requisitioner;
            requisitionerHtml = `
                <div class="tv-section">
                    <div class="tv-heading"><i class="fas fa-user"></i> Requisitioned By</div>
                    ${tvRow('Name', r.name)}
                    ${tvRow('Designation', r.designation)}
                    ${tvRow('Division', r.division)}
                    ${tvRow('Email', r.email)}
                    ${tvRow('Phone', r.phone)}
                    ${tvRowsForObject(Object.fromEntries(Object.entries(r).filter(([k]) => !['name','designation','division','email','phone'].includes(k))), '')}
                </div>
            `;
        }

        let tripsHtml = '';
        if (fd.trips && Array.isArray(fd.trips) && fd.trips.length) {
            tripsHtml = `
                <div class="tv-section">
                    <div class="tv-heading"><i class="fas fa-road"></i> Trip Details</div>
                    ${tvRow('Start Date', fd.start_date)}
                    ${tvRow('End Date', fd.end_date)}
                    <table class="tv-table" style="margin-top:10px;">
                        <thead><tr><th>#</th><th>From</th><th>To</th><th>Officials</th><th>Purpose</th></tr></thead>
                        <tbody>
                            ${fd.trips.map((trip, idx) => `
                                <tr>
                                    <td>${idx+1}</td>
                                    <td>${escapeHtml(trip.place_from)}</td>
                                    <td>${escapeHtml(trip.place_to)}</td>
                                    <td>${escapeHtml(trip.officials)}</td>
                                    <td>${escapeHtml(trip.purpose)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } else if (fd.start_date || fd.end_date) {
            tripsHtml = `
                <div class="tv-section">
                    <div class="tv-heading"><i class="fas fa-road"></i> Trip Dates</div>
                    ${tvRow('Start Date', fd.start_date)}
                    ${tvRow('End Date', fd.end_date)}
                </div>
            `;
        }

        let itemsHtml = '';
        if (fd.items && Array.isArray(fd.items) && fd.items.length) {
            const cols = Array.from(fd.items.reduce((set, item) => { Object.keys(item).forEach(k => set.add(k)); return set; }, new Set()));
            const headerCells = cols.map(c => `<th>${escapeHtml(tvLabelize(c))}</th>`).join('');
            const bodyRows = fd.items.map((item, idx) =>
                `<tr><td>${idx+1}</td>${cols.map(c => `<td>${escapeHtml(tvDisplay(item[c]) ?? '—')}</td>`).join('')}</tr>`
            ).join('');
            itemsHtml = `
                <div class="tv-section">
                    <div class="tv-heading"><i class="fas fa-list"></i> Items Requested</div>
                    <table class="tv-table">
                        <thead><tr><th>#</th>${headerCells}</tr></thead>
                        <tbody>${bodyRows}</tbody>
                    </table>
                </div>
            `;
        }

        let allocationHtml = '';
        if (hasAllocation) {
            allocationHtml = `
                <div class="tv-section">
                    <div class="tv-heading"><i class="fas fa-truck"></i> Vehicle Allocation</div>
                    ${tvRow('Driver', allocation.driver_name)}
                    ${tvRow('Driver Phone', allocation.driver_phone || allocation.phone)}
                    ${tvRow('Vehicle Name', allocation.vehicle_name)}
                    ${tvRow('Vehicle No.', allocation.vehicle_no)}
                    ${tvRow('Allocated By', allocation.allocated_by)}
                    ${tvRow('Allocated At', allocation.allocated_at ? new Date(allocation.allocated_at).toLocaleString() : null)}
                    ${tvRowsForObject(Object.fromEntries(Object.entries(allocation).filter(([k]) => !['driver_name','driver_phone','phone','vehicle_name','vehicle_no','allocated_by','allocated_at','driver_id'].includes(k))), '')}
                </div>
            `;
        }

        let otherFormDataHtml = '';
        const otherKeys = Object.keys(fd).filter(k => !TV_HANDLED_FORM_KEYS.has(k));
        if (otherKeys.length) {
            let rows = '';
            for (const key of otherKeys) {
                const val = fd[key];
                if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
                    rows += tvRowsForObject(val, tvLabelize(key));
                } else if (Array.isArray(val) && val.length && val.every(v => v !== null && typeof v === 'object')) {
                    const cols = Array.from(val.reduce((set, item) => { Object.keys(item).forEach(k => set.add(k)); return set; }, new Set()));
                    rows += `<div class="tv-row"><span class="tv-label">${escapeHtml(tvLabelize(key))}</span><span class="tv-value"></span></div>`;
                    rows += `<table class="tv-table"><thead><tr>${cols.map(c => `<th>${escapeHtml(tvLabelize(c))}</th>`).join('')}</tr></thead><tbody>`;
                    rows += val.map(item => `<tr>${cols.map(c => `<td>${escapeHtml(tvDisplay(item[c]) ?? '—')}</td>`).join('')}</tr>`).join('');
                    rows += `</tbody></table>`;
                } else {
                    rows += tvRow(tvLabelize(key), val);
                }
            }
            otherFormDataHtml = `
                <div class="tv-section">
                    <div class="tv-heading"><i class="fas fa-info-circle"></i> Additional Details</div>
                    ${rows}
                </div>
            `;
        }

        const commentsSectionHtml = `
            <div class="tv-section">
                <div class="tv-heading"><i class="fas fa-comments"></i> Comments</div>
                <div id="modalCommentsSection"></div>
            </div>
        `;

        const addCommentHtml = `
            <div class="tv-section">
                <div class="tv-heading"><i class="fas fa-plus-circle"></i> Add Comment</div>
                <textarea id="modalNewComment" rows="3" placeholder="Write your message..."></textarea>
                <button id="modalSubmitCommentBtn" class="btn-primary-sm">Post Comment</button>
            </div>
        `;

        container.innerHTML = `
            ${ticketInfoHtml}
            ${requisitionerHtml}
            ${tripsHtml}
            ${itemsHtml}
            ${allocationHtml}
            ${otherFormDataHtml}
            ${commentsSectionHtml}
            ${addCommentHtml}
        `;
    }

    function renderModalComments(comments) {
        const container = document.getElementById('modalCommentsSection');
        if (!container) return;
        const publicComments = comments.filter(c => !c.is_internal);
        if (!publicComments.length) {
            container.innerHTML = '<p style="color:#64748B; font-size:0.9rem;">No comments yet.</p>';
            return;
        }
        container.innerHTML = publicComments.map(c => `
            <div class="comment">
                <div class="comment-meta"><strong>${escapeHtml(c.author_name)}</strong> · ${new Date(c.created_at).toLocaleString()}</div>
                <div style="font-size:0.9rem;">${escapeHtml(c.message)}</div>
            </div>
        `).join('');
    }

    function attachModalEventListeners() {
        const submitBtn = document.getElementById('modalSubmitCommentBtn');
        if (submitBtn) {
            submitBtn.onclick = async () => {
                const message = document.getElementById('modalNewComment').value.trim();
                if (!message) return alert('Please enter a comment');
                await apiCall(`/requests/${currentModalTicket.id}/comment`, {
                    method: 'POST',
                    body: JSON.stringify({ message, is_internal: false })
                });
                document.getElementById('modalNewComment').value = '';
                showTicketModal(currentModalTicket.id);
                loadTickets();
            };
        }
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    async function updateNotificationCount() {
        try {
            const notifs = await apiCall('/notifications');
            const badge = document.querySelector('#notificationBell .badge');
            if (badge) { badge.textContent = notifs.length; badge.style.display = notifs.length ? 'inline-flex' : 'none'; }
        } catch(e) {}
    }
    document.getElementById('notificationBell').addEventListener('click', async () => {
        const notifs = await apiCall('/notifications');
        if (!notifs.length) { alert('No new notifications'); return; }
        const msg = 'Notifications:\n' + notifs.map(n => `- ${n.message}`).join('\n');
        if (confirm(msg + '\nMark all as read?')) {
            await apiCall('/notifications/mark-read', { method: 'POST', body: JSON.stringify({}) });
            updateNotificationCount();
        }
    });
    setInterval(updateNotificationCount, 30000);
    updateNotificationCount();

    loadTickets();
</script>
</body>
</html>
