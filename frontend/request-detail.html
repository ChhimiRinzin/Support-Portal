<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details – RAA Support</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #F4F7FC;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #0F5C5F;
            margin: 0;
        }

        .header h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748B;
        }

        .btn-back {
            background: #EFF3F8;
            color: #0F5C5F;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .btn-back:hover {
            background: #DFE6EF;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #0F5C5F;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #0a4648;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .card {
            background: #FAFCFE;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid #E9EDF2;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #0F5C5F;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            width: 24px;
            text-align: center;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 30px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #1E293B;
            font-size: 0.95rem;
            padding-top: 2px;
            word-break: break-word;
        }

        .info-value .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending_approval {
            background: #FEF5E7;
            color: #C47B2E;
        }
        .status-approved {
            background: #E6F7EC;
            color: #1E7B48;
        }
        .status-in_progress {
            background: #E8F0FE;
            color: #2266C7;
        }
        .status-resolved {
            background: #E6F7EC;
            color: #1E7B48;
        }
        .status-rejected {
            background: #FEE9E9;
            color: #C62B2B;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .items-table th,
        .items-table td {
            border: 1px solid #E2E8F0;
            padding: 10px 12px;
            text-align: left;
        }

        .items-table th {
            background: #F1F5F9;
            font-weight: 600;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            padding: 16px 0;
            border-top: 1px solid #E9EDF2;
            border-bottom: 1px solid #E9EDF2;
            margin-top: 8px;
        }

        .action-bar select {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #CBD5E1;
            background: white;
            font-size: 0.9rem;
        }

        .allocation-box {
            background: #F0FDF4;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            border: 1px solid #DCFCE7;
        }

        .comments-section .comment {
            border-left: 4px solid #0F5C5F;
            padding: 12px 16px;
            background: #FAFCFE;
            border-radius: 12px;
            margin: 12px 0;
        }

        .comments-section .comment.internal-note {
            background: #FEF9E3;
            border-left-color: #F59E0B;
        }

        .comment-meta {
            font-size: 0.8rem;
            color: #64748B;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .internal-tag {
            background: #F59E0B;
            color: white;
            padding: 0 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .add-comment textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #CBD5E1;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 80px;
            margin: 8px 0;
        }

        .add-comment .checkbox-group {
            margin: 12px 0;
        }

        .add-comment .checkbox-group label {
            font-size: 0.9rem;
            color: #475569;
        }

        .error-box {
            background: #FEE2E2;
            color: #B91C1C;
            padding: 24px;
            border-radius: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748B;
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #0F5C5F;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header h1 {
                text-align: center;
            }

            .btn-back {
                justify-content: center;
            }

            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .action-bar select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 id="pageTitle">Request Details</h1>
            <button class="btn-back" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
        </div>

        <!-- Content -->
        <div id="content">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i><br>Loading ticket...</div>
        </div>
    </div>

    <script>
        console.log('✅ request-detail.html loaded (clean version)');

        const API_BASE = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        let currentTicket = null;
        let canManage = false;

        if (!token) {
            document.getElementById('content').innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-circle"></i> Not authenticated.
                    <button class="btn-primary" onclick="window.location.href='index.html'" style="margin-top:12px;">Login</button>
                </div>
            `;
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            const requestId = urlParams.get('id');
            if (!requestId || isNaN(parseInt(requestId))) {
                document.getElementById('content').innerHTML = `
                    <div class="error-box">
                        <i class="fas fa-exclamation-triangle"></i> Invalid Ticket ID.
                        <button class="btn-primary" onclick="window.location.href='${getDashboardPath()}'" style="margin-top:12px;">Go back</button>
                    </div>
                `;
            } else {
                loadTicket(parseInt(requestId));
            }
        }

        function getDashboardPath() {
            return currentUser.is_manager ? 'manager-dashboard.html' : 'dashboard.html';
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = getDashboardPath();
        });

        async function apiCall(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json', 'x-auth-token': token };
            const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'index.html';
                throw new Error('Session expired');
            }
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Request failed');
            return data;
        }

        async function loadTicket(id) {
            try {
                const data = await apiCall(`/requests/${id}`);
                currentTicket = data.ticket;
                canManage = (currentUser.id !== currentTicket.created_by);
                document.getElementById('pageTitle').innerHTML = `Request #${escapeHtml(currentTicket.ticket_number)}`;
                renderTicket();
                renderComments(data.comments);
            } catch (err) {
                document.getElementById('content').innerHTML = `
                    <div class="error-box">
                        <i class="fas fa-exclamation-circle"></i> Error: ${escapeHtml(err.message)}
                        <button class="btn-primary" onclick="window.location.href='${getDashboardPath()}'" style="margin-top:12px;">Go back</button>
                    </div>
                `;
            }
        }

        function renderTicket() {
            const container = document.getElementById('content');
            const fd = currentTicket.form_data || {};

            // ---- Status badge ----
            const statusClass = `status-badge status-${currentTicket.status}`;

            // ---- Ticket info grid ----
            let ticketInfo = `
                <div class="card">
                    <div class="card-title"><i class="fas fa-info-circle"></i> Ticket Information</div>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Ticket Number</span>
                            <span class="info-value">${escapeHtml(currentTicket.ticket_number)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Status</span>
                            <span class="info-value"><span class="${statusClass}">${currentTicket.status.replace(/_/g, ' ')}</span></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Title</span>
                            <span class="info-value">${escapeHtml(currentTicket.title)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Category</span>
                            <span class="info-value">${escapeHtml(currentTicket.category)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Requester</span>
                            <span class="info-value">${escapeHtml(currentTicket.requester_name || currentTicket.requester_email)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Created</span>
                            <span class="info-value">${new Date(currentTicket.created_at).toLocaleString()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Priority</span>
                            <span class="info-value">${escapeHtml(currentTicket.priority)}</span>
                        </div>
                        <div class="info-item full-width">
                            <span class="info-label">Description</span>
                            <span class="info-value">${escapeHtml(currentTicket.description)}</span>
                        </div>
                    </div>
                </div>
            `;

            // ---- Allocation (vehicle) ----
            let allocationHtml = '';
            const alloc = fd.vehicle_allocation;
            if (alloc && (alloc.vehicle_no || alloc.driver_name)) {
                allocationHtml = `
                    <div class="card" style="border-left:4px solid #10B981;">
                        <div class="card-title"><i class="fas fa-truck"></i> Vehicle Allocation</div>
                        <div class="info-grid">
                            <div class="info-item"><span class="info-label">Driver</span><span class="info-value">${escapeHtml(alloc.driver_name || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${escapeHtml(alloc.driver_phone || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Vehicle Name</span><span class="info-value">${escapeHtml(alloc.vehicle_name || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Vehicle No.</span><span class="info-value">${escapeHtml(alloc.vehicle_no || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Allocated By</span><span class="info-value">${escapeHtml(alloc.allocated_by || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Allocated At</span><span class="info-value">${alloc.allocated_at ? new Date(alloc.allocated_at).toLocaleString() : '-'}</span></div>
                        </div>
                    </div>
                `;
            }

            // ---- Requisitioner ----
            let reqHtml = '';
            if (fd.requisitioner) {
                const r = fd.requisitioner;
                reqHtml = `
                    <div class="card">
                        <div class="card-title"><i class="fas fa-user"></i> Requisitioned by</div>
                        <div class="info-grid">
                            <div class="info-item"><span class="info-label">Name</span><span class="info-value">${escapeHtml(r.name || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Designation</span><span class="info-value">${escapeHtml(r.designation || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Division</span><span class="info-value">${escapeHtml(r.division || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Email</span><span class="info-value">${escapeHtml(r.email || '-')}</span></div>
                            <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${escapeHtml(r.phone || '-')}</span></div>
                        </div>
                    </div>
                `;
            }

            // ---- Trips (vehicle) ----
            let tripsHtml = '';
            if (currentTicket.category === 'vehicle' && fd.trips && fd.trips.length) {
                let rows = fd.trips.map((trip, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(trip.place_from || '')}</td>
                        <td>${escapeHtml(trip.place_to || '')}</td>
                        <td>${escapeHtml(trip.officials || '')}</td>
                        <td>${escapeHtml(trip.purpose || '')}</td>
                    </tr>
                `).join('');
                tripsHtml = `
                    <div class="card">
                        <div class="card-title"><i class="fas fa-road"></i> Trip Details</div>
                        <div class="info-grid" style="margin-bottom:12px;">
                            <div class="info-item"><span class="info-label">Start Date</span><span class="info-value">${escapeHtml(fd.start_date || '-')}</span></div>
                            <div class="info-item"><span class="info-label">End Date</span><span class="info-value">${escapeHtml(fd.end_date || '-')}</span></div>
                        </div>
                        <table class="items-table">
                            <thead><tr><th style="width:8%">#</th><th>From</th><th>To</th><th>Officials</th><th>Purpose</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            }

            // ---- Items (ICT, Repair, AIMS) ----
            let itemsHtml = '';
            if (fd.items && fd.items.length) {
                let rows = fd.items.map((item, idx) => {
                    // Handle different item structures
                    const type = item.itemType || item.type || '';
                    const desc = item.defects || item.problemDescription || item.description || '';
                    const remarks = item.remarks || '';
                    return `<tr><td>${idx+1}</td><td>${escapeHtml(type)}</td><td>${escapeHtml(desc)}</td><td>${escapeHtml(remarks)}</td></tr>`;
                }).join('');
                itemsHtml = `
                    <div class="card">
                        <div class="card-title"><i class="fas fa-list"></i> Items requested</div>
                        <table class="items-table">
                            <thead><tr><th style="width:8%">#</th><th style="width:25%">Item Type</th><th style="width:50%">Description / Defects</th><th style="width:17%">Remarks</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            }

            // ---- Action bar (managers only) ----
            let actionHtml = '';
            if (canManage) {
                const options = ['pending_approval', 'approved', 'in_progress', 'resolved', 'rejected'];
                let opts = options.map(s => `<option value="${s}" ${currentTicket.status === s ? 'selected' : ''}>${s.replace(/_/g, ' ')}</option>`).join('');
                actionHtml = `
                    <div class="action-bar">
                        <select id="statusSelect">${opts}</select>
                        <button class="btn-primary" id="updateStatusBtn">Update Status</button>
                    </div>
                `;
            }

            // ---- Assemble ----
            container.innerHTML = `
                ${ticketInfo}
                ${allocationHtml}
                ${reqHtml}
                ${tripsHtml}
                ${itemsHtml}
                ${actionHtml}
                <div id="commentsSection"></div>
                <div class="add-comment">
                    <div class="card-title"><i class="fas fa-comment"></i> Add Comment</div>
                    <textarea id="newComment" rows="3" placeholder="Write your message..."></textarea>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="internalCheck"> Internal note (team only)</label>
                    </div>
                    <button class="btn-primary" id="submitCommentBtn">Post Comment</button>
                </div>
            `;

            // ---- Event listeners ----
            if (canManage) {
                document.getElementById('updateStatusBtn').addEventListener('click', async () => {
                    const newStatus = document.getElementById('statusSelect').value;
                    try {
                        await apiCall(`/requests/${currentTicket.id}/status`, {
                            method: 'PUT',
                            body: JSON.stringify({ status: newStatus })
                        });
                        loadTicket(currentTicket.id);
                    } catch (err) {
                        alert('Status update failed: ' + err.message);
                    }
                });
            }

            document.getElementById('submitCommentBtn').addEventListener('click', async () => {
                const message = document.getElementById('newComment').value.trim();
                if (!message) {
                    alert('Please enter a comment.');
                    return;
                }
                const isInternal = document.getElementById('internalCheck').checked;
                try {
                    await apiCall(`/requests/${currentTicket.id}/comment`, {
                        method: 'POST',
                        body: JSON.stringify({ message, is_internal: isInternal })
                    });
                    document.getElementById('newComment').value = '';
                    document.getElementById('internalCheck').checked = false;
                    loadTicket(currentTicket.id);
                } catch (err) {
                    alert('Failed to post comment: ' + err.message);
                }
            });
        }

        function renderComments(comments) {
            const container = document.getElementById('commentsSection');
            if (!comments || !comments.length) {
                container.innerHTML = '<div class="card"><div class="card-title"><i class="fas fa-comments"></i> Comments</div><p style="color:#64748B;">No comments yet.</p></div>';
                return;
            }

            let html = '<div class="card comments-section"><div class="card-title"><i class="fas fa-comments"></i> Comments</div>';
            for (const c of comments) {
                if (c.is_internal && !canManage && currentTicket.created_by === currentUser.id) continue;
                const internalClass = c.is_internal ? 'internal-note' : '';
                const tag = c.is_internal ? '<span class="internal-tag">🔒 Internal</span>' : '';
                html += `
                    <div class="comment ${internalClass}">
                        <div class="comment-meta">
                            <span><strong>${escapeHtml(c.author_name)}</strong> · ${new Date(c.created_at).toLocaleString()}</span>
                            ${tag}
                        </div>
                        <div>${escapeHtml(c.message)}</div>
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
